[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcprift"
dynamic = ["version"]
description = "A deterministic CI regression runner for MCP authorization policies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["authorization", "ci", "mcp", "security", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = ["httpx2>=2.5,<3", "mcp==2.0.0"]

[dependency-groups]
dev = ["ruff==0.13.3"]

[project.scripts]
mcprift = "mcprift.cli:main"

[project.urls]
Changelog = "https://github.com/sanjayy0612/MCPRift/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sanjayy0612/MCPRift/blob/main/docs/writing-contracts.md"
Homepage = "https://github.com/sanjayy0612/MCPRift"
Issues = "https://github.com/sanjayy0612/MCPRift/issues"
Source = "https://github.com/sanjayy0612/MCPRift"

[tool.hatch.version]
path = "src/mcprift/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/assets", "/legacy-go", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcprift"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
